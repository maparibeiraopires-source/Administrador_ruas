<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrador de Ruas — Supabase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#f7f4f1;color:#2f2925}
header{background:linear-gradient(135deg,#b94e16,#e97828);color:#fff;padding:24px 28px;box-shadow:0 3px 15px #0002}
header h1{margin:0 0 6px;font-size:25px} header p{margin:0;opacity:.92}
main{max-width:1400px;margin:22px auto;padding:0 18px}
.panel{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 16px #00000012}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea,select{font:inherit;border:1px solid #ddd2ca;border-radius:9px;padding:11px 12px;background:#fff;width:100%}
button{font:inherit;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:#c95c1d;color:#fff}.secondary{background:#eee6df;color:#4b3b31}.danger{background:#b52d25;color:#fff}.success{background:#36834d;color:#fff}
.small{font-size:12px;color:#746960}.status{font-weight:600;margin-top:10px}
.login{max-width:480px;margin:70px auto}.login h2{margin-top:0}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#624d41}
.search{flex:1;min-width:280px}.count{font-weight:700;color:#87502f}
.tablewrap{overflow:auto;max-height:58vh;border:1px solid #eee3dc;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#fff5ed;z-index:1}tr:hover{background:#fffaf6}
.actions{display:flex;gap:6px}.actions button{padding:7px 10px;font-size:12px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}.modalbox{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#f3e5db;color:#8c481e;font-size:11px;font-weight:800}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{padding:20px}.modalbox{padding:16px}}
</style>
</head>
<body>

<header>
  <h1>Administrador de Ruas</h1>
  <p>Cadastro, alteração, duplicação e correção dos dados da tabela <strong>ruas</strong>.</p>
</header>

<div id="loginView" class="login panel">
  <h2>Acesso administrativo</h2>
  <p class="small">Entre com um usuário autorizado do Supabase. A edição não fica aberta para visitantes.</p>
  <div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="primary" onclick="login()">Entrar</button>
  <div id="loginStatus" class="status"></div>
</div>

<main id="appView" style="display:none">
  <div class="panel">
    <div class="row">
      <input id="search" class="search" placeholder="Pesquisar por nome, número, bairro, decreto, pavimentação...">
      <button class="primary" onclick="novoRegistro()">+ Nova via</button>
      <button class="secondary" onclick="carregar()">↻ Atualizar</button>
      <button class="secondary" onclick="logout()">Sair</button>
    </div>
    <div id="status" class="status">Carregando...</div>
  </div>

  <div class="panel">
    <div class="tablewrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="modal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <div>
        <h2 id="modalTitle" style="margin:0 0 5px">Editar via</h2>
        <span id="modalBadge" class="badge"></span>
      </div>
      <button class="secondary" onclick="fecharModal()">✕</button>
    </div>
    <div id="form" class="grid"></div>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button class="secondary" onclick="fecharModal()">Cancelar</button>
      <button id="duplicateBtn" class="secondary" onclick="duplicarAtual()">Duplicar</button>
      <button id="deleteBtn" class="danger" onclick="excluirAtual()">Excluir</button>
      <button class="success" onclick="salvar()">Salvar</button>
    </div>
    <div id="modalStatus" class="status"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ypykiczrahhjepwojaim.supabase.co";
const SUPABASE_KEY = "sb_publishable_7cjD1eDSihnnTR70q-3Ytg_diHgiKMy";
const TABLE = "ruas";

let token = null;
let dados = [];
let columns = [];
let editing = null;
let isNew = false;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function headers(extra={}) {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (token || SUPABASE_KEY),
    "Content-Type":"application/json",
    ...extra
  };
}

async function login(){
  const email=$("email").value.trim(), password=$("password").value;
  $("loginStatus").textContent="Entrando...";
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error_description || j.msg || "E-mail ou senha inválidos.");
    token=j.access_token;
    sessionStorage.setItem("ruas_admin_token",token);
    mostrarApp();
    await carregar();
  }catch(e){$("loginStatus").textContent="Erro: "+e.message}
}

async function logout(){
  if(token){
    try{await fetch(SUPABASE_URL+"/auth/v1/logout",{method:"POST",headers:headers()})}catch(e){}
  }
  token=null; sessionStorage.removeItem("ruas_admin_token");
  $("appView").style.display="none"; $("loginView").style.display="block";
}

function mostrarApp(){
  $("loginView").style.display="none"; $("appView").style.display="block";
}

async function carregar(){
  $("status").textContent="Carregando dados...";
  try{
    // Busca as colunas e todos os registros em páginas de 1000.
    let todos=[], inicio=0, limite=1000;
    while(true){
      const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.asc&limit=${limite}&offset=${inicio}`,{headers:headers()});
      const txt=await r.text();
      if(!r.ok) throw new Error(txt);
      const lote=txt?JSON.parse(txt):[];
      todos.push(...lote);
      if(lote.length<limite) break;
      inicio+=limite;
    }
    dados=todos;
    columns=dados.length?Object.keys(dados[0]):await descobrirColunas();
    renderTabela();
    $("status").textContent=`${dados.length.toLocaleString("pt-BR")} registros carregados.`;
  }catch(e){$("status").textContent="Erro ao carregar: "+e.message}
}

async function descobrirColunas(){
  // Se a tabela estiver vazia, o navegador não consegue descobrir as colunas via REST.
  // A criação de uma nova via exige que exista pelo menos um registro ou que as colunas
  // sejam informadas no banco.
  return ["id","created_at","NÚMERO DA RUA"];
}

function renderTabela(){
  const q=$("search").value.trim().toLowerCase();
  const filtrados=!q?dados:dados.filter(r=>Object.values(r).some(v=>String(v??"").toLowerCase().includes(q)));
  const mostrarCols=columns.filter(c=>c!=="id" && c!=="created_at").slice(0,8);
  $("thead").innerHTML="<tr><th>ID</th>"+mostrarCols.map(c=>`<th>${esc(c)}</th>`).join("")+"<th>Ações</th></tr>";
  $("tbody").innerHTML=filtrados.map((r)=>{
    const idx=dados.indexOf(r);
    return `<tr>
      <td>${esc(r.id)}</td>
      ${mostrarCols.map(c=>`<td>${esc(r[c])}</td>`).join("")}
      <td><div class="actions">
        <button class="primary" onclick="editar(${idx})">Editar</button>
        <button class="secondary" onclick="abrirDuplicar(${idx})">Duplicar</button>
      </div></td>
    </tr>`;
  }).join("");
}
$("search").addEventListener("input",renderTabela);

function camposEditaveis(){
  return columns.filter(c=>c!=="id" && c!=="created_at" && c!=="updated_at" && c!=="criado_em" && c!=="atualizado_em");
}

function novoRegistro(){
  isNew=true; editing=null;
  $("modalTitle").textContent="Nova via";
  $("modalBadge").textContent="NOVO REGISTRO";
  $("deleteBtn").style.display="none";
  $("duplicateBtn").style.display="none";
  montarForm({});
  $("modal").classList.add("open");
}

function editar(i){
  isNew=false; editing=i;
  $("modalTitle").textContent="Editar via";
  $("modalBadge").textContent="ID "+dados[i].id;
  $("deleteBtn").style.display="";
  $("duplicateBtn").style.display="";
  montarForm(dados[i]);
  $("modal").classList.add("open");
}

function abrirDuplicar(i){
  isNew=true; editing=null;
  const copia={...dados[i]};
  delete copia.id; delete copia.created_at; delete copia.updated_at; delete copia.criado_em; delete copia.atualizado_em;
  $("modalTitle").textContent="Duplicar via";
  $("modalBadge").textContent="NOVO REGISTRO A PARTIR DO ID "+dados[i].id;
  $("deleteBtn").style.display="none";
  $("duplicateBtn").style.display="none";
  montarForm(copia);
  $("modal").classList.add("open");
}

function montarForm(obj){
  $("form").innerHTML=camposEditaveis().map((c)=>{
    const valor=obj[c]??"";
    const long=String(valor).length>80 || /observ|descri|decreto|lei|complemento/i.test(c);
    return `<div class="${long?'full':''} field">
      <label>${esc(c)}</label>
      ${long
        ? `<textarea data-col="${esc(c)}" rows="3">${esc(valor)}</textarea>`
        : `<input data-col="${esc(c)}" value="${esc(valor)}">`}
    </div>`;
  }).join("");
}

function valoresFormulario(){
  const obj={};
  document.querySelectorAll("#form [data-col]").forEach(el=>{
    obj[el.dataset.col]=el.value;
  });
  return obj;
}

async function salvar(){
  const obj=valoresFormulario();
  $("modalStatus").textContent="Salvando...";
  try{
    let r;
    if(isNew){
      r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{
        method:"POST",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify(obj)
      });
    }else{
      const id=dados[editing].id;
      r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`,{
        method:"PATCH",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify(obj)
      });
    }
    const txt=await r.text();
    if(!r.ok) throw new Error(txt);
    fecharModal();
    await carregar();
    $("status").textContent=isNew?"Nova via cadastrada com sucesso.":"Registro atualizado com sucesso.";
  }catch(e){$("modalStatus").textContent="Erro ao salvar: "+e.message}
}

async function duplicarAtual(){
  const obj=valoresFormulario();
  delete obj.id; delete obj.created_at; delete obj.updated_at; delete obj.criado_em; delete obj.atualizado_em;
  $("modalStatus").textContent="Duplicando...";
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{
      method:"POST",headers:{...headers(),"Prefer":"return=representation"},body:JSON.stringify(obj)
    });
    const txt=await r.text();
    if(!r.ok) throw new Error(txt);
    fecharModal(); await carregar();
    $("status").textContent="Registro duplicado. Agora você pode alterar o nome, número, decreto ou pavimentação da nova via.";
  }catch(e){$("modalStatus").textContent="Erro ao duplicar: "+e.message}
}

async function excluirAtual(){
  if(isNew||editing===null)return;
  const r0=dados[editing];
  if(!confirm(`Excluir definitivamente o registro ID ${r0.id}?`))return;
  $("modalStatus").textContent="Excluindo...";
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(r0.id)}`,{method:"DELETE",headers:headers()});
    const txt=await r.text();
    if(!r.ok) throw new Error(txt);
    fecharModal(); await carregar();
    $("status").textContent="Registro excluído.";
  }catch(e){$("modalStatus").textContent="Erro ao excluir: "+e.message}
}

function fecharModal(){
  $("modal").classList.remove("open");
  $("modalStatus").textContent="";
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharModal()});

window.addEventListener("load",()=>{
  token=sessionStorage.getItem("ruas_admin_token");
  if(token){mostrarApp();carregar().catch(()=>logout())}
});
</script>
</body>
</html>
